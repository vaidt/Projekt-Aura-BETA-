name: Authority Source Byte & Signature Observation

on:
  pull_request:
  push:
    branches:
      - main
      - alpha/bootstrap-architecture
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authority-source-observation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe-primary-authority:
    name: Observe pinned authority-source signatures (non-constitutive)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm OpenSSH availability
        run: |
          command -v ssh-keygen
          ssh -V 2>&1

      - name: Pin source inputs and observe exact-byte signatures
        run: bash scripts/verify-primary-authority-chain.sh

      - name: Upload observation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-primary-authority-observation
          path: ${{ runner.temp }}/aura-primary-authority-observation/authority-source-signature-observation.json
          if-no-files-found: warn
          retention-days: 30
