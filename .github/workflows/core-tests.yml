name: Aura Core CI

on:
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core-tests.yml"
  push:
    paths:
      - "core/**"
      - ".github/workflows/core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Full pytest suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test runner
        run: |
          python -m pip install pytest
          python -c "import pytest; print('pytest import: PASS')"

      - name: Fail closed if Core has not been migrated
        shell: bash
        run: |
          if [[ ! -f core/pyproject.toml ]]; then
            echo "::error title=Core source missing::Expected core/pyproject.toml."
            exit 1
          fi
          if [[ ! -f core/LICENSE ]]; then
            echo "::error title=Core licence missing::Expected core/LICENSE."
            exit 1
          fi
          if [[ ! -f core/core/test_ari_observability.py ]]; then
            echo "::error title=Core test source missing::Expected core/core/test_ari_observability.py."
            exit 1
          fi
          if ! find core -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            echo "::error title=Core tests missing::No Python test files were found under core/."
            exit 1
          fi

      - name: Verify Docker engine and Compose
        run: |
          docker --version
          docker compose version
          docker info

      - name: Install Aura Core
        working-directory: core
        run: python -m pip install -e .

      - name: Validate Python environment
        working-directory: core
        run: python -m pip check

      - name: Full pytest suite
        working-directory: core
        run: |
          mkdir -p artifacts
          python -m pytest -q . --junitxml=artifacts/core-junit.xml

      - name: Upload pytest result
        if: always() && hashFiles('core/artifacts/core-junit.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aura-core-pytest-${{ github.sha }}
          path: core/artifacts/core-junit.xml
          if-no-files-found: error
          retention-days: 30
