name: One-time schema lockfile generator

on:
  push:
    branches:
      - alpha/bootstrap-architecture

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.ref == 'refs/heads/alpha/bootstrap-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the BETA work branch
        uses: actions/checkout@v4
        with:
          ref: alpha/bootstrap-architecture
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve complete transitive dependency lock
        working-directory: tools/schema-validator
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit the generated lockfile to this work branch only
        run: |
          if git diff --quiet -- tools/schema-validator/package-lock.json; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/schema-validator/package-lock.json
          git commit -m "build: lock transitive schema validator dependencies"
          git push origin HEAD:alpha/bootstrap-architecture
