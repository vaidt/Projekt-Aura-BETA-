name: AURA Main Protection Negative Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  synthetic-schema-pass:
    name: Validate evidence schemas and records
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit synthetic PASS for policy isolation only
        run: |
          echo "SYNTHETIC NEGATIVE TEST ONLY; not schema validation or AURA evidence."
          exit 0

  synthetic-authority-observation-pass:
    name: Observe pinned authority-source signatures (non-constitutive)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit synthetic PASS for policy isolation only
        run: |
          echo "SYNTHETIC NEGATIVE TEST ONLY; not signature verification or AURA evidence."
          exit 0

  negative-m1-check:
    name: M1 exact-byte signature gate (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deliberately fail the required-check control test
        run: |
          echo "::error::SYNTHETIC NEGATIVE TEST ONLY. This is not the AURA M1 verifier and is not protocol evidence."
          exit 1
